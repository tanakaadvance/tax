<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>巡回監査レポート</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="監査レポート">
  <meta name="theme-color" content="#ffffff">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-noto-sans { font-family: 'Noto Sans JP', sans-serif !important; }
    
    /* Excel風の罫線背景（30px間隔） */
    .lined-bg {
      background-image: repeating-linear-gradient(transparent, transparent 29px, #9ca3af 29px, #9ca3af 30px);
      line-height: 30px;
      background-attachment: local;
      background-position: top;
    }

    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { margin: 0; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .print-area {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- アイコン ---
    const IconSettings = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const IconFileText = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconPrinter = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
    const IconPlus = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash2 = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const IconEdit3 = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;

    // --- 定数 ---
    const years = Array.from({ length: 20 }, (_, i) => i + 1);
    const months = Array.from({ length: 12 }, (_, i) => i + 1);
    const days = Array.from({ length: 31 }, (_, i) => i + 1);
    const hours = Array.from({ length: 24 }, (_, i) => i.toString().padStart(2, '0'));
    const minutes = Array.from({ length: 60 }, (_, i) => i.toString().padStart(2, '0'));

    // --- コンポーネント: 設定画面 ---
    const SettingsView = ({ settings, setSettings }) => {
      const [newItem, setNewItem] = useState({ clients: '', participants: '', staffs: '' });

      const handleAdd = (key) => {
        if (!newItem[key]) return;
        setSettings(prev => ({ ...prev, [key]: [...prev[key], newItem[key]] }));
        setNewItem(prev => ({ ...prev, [key]: '' }));
      };

      const handleRemove = (key, index) => {
        setSettings(prev => ({ ...prev, [key]: prev[key].filter((_, i) => i !== index) }));
      };

      const renderListEditor = (title, key, placeholder) => (
        <div className="mb-6 bg-white p-4 rounded-lg shadow">
          <h3 className="font-bold mb-2 text-gray-700">{title}</h3>
          <div className="flex gap-2 mb-3">
            <input
              type="text"
              value={newItem[key]}
              onChange={(e) => setNewItem(prev => ({ ...prev, [key]: e.target.value }))}
              placeholder={placeholder}
              className="flex-1 border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button onClick={() => handleAdd(key)} className="bg-blue-600 text-white p-2 rounded flex items-center justify-center w-12">
              <IconPlus size={20} />
            </button>
          </div>
          <ul className="space-y-2">
            {settings[key].map((item, i) => (
              <li key={i} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-200">
                <span>{item}</span>
                <button onClick={() => handleRemove(key, i)} className="text-red-500 p-1">
                  <IconTrash2 size={18} />
                </button>
              </li>
            ))}
          </ul>
        </div>
      );

      return (
        <div className="p-4 no-print pb-24">
          <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><IconSettings className="text-gray-600" /> 設定・マスタ登録</h2>
          {renderListEditor('関与先リスト', 'clients', '新しい関与先を追加')}
          {renderListEditor('参加者リスト', 'participants', '新しい参加者を追加')}
          {renderListEditor('担当者リスト', 'staffs', '新しい担当者を追加')}
        </div>
      );
    };

    // --- コンポーネント: 入力画面 ---
    const InputFormView = ({ formData, handleChange, settings }) => (
      <div className="p-4 no-print pb-24 max-w-2xl mx-auto space-y-6">
        <h2 className="text-xl font-bold flex items-center gap-2 mb-4"><IconEdit3 className="text-blue-600" /> レポート入力</h2>

        <section className="bg-white p-4 rounded-lg shadow space-y-4">
          <h3 className="font-bold text-gray-700 border-b pb-2">基本情報</h3>
          
          <div>
            <label className="block text-sm text-gray-600 mb-1">訪問日</label>
            <div className="flex items-center gap-2 text-lg">
              <span>R</span>
              <select name="visitYear" value={formData.visitYear} onChange={handleChange} className="border p-2 rounded bg-gray-50">{years.map(y => <option key={y} value={y}>{y}</option>)}</select>
              <span>年</span>
              <select name="visitMonth" value={formData.visitMonth} onChange={handleChange} className="border p-2 rounded bg-gray-50">{months.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <span>月</span>
              <select name="visitDay" value={formData.visitDay} onChange={handleChange} className="border p-2 rounded bg-gray-50">{days.map(d => <option key={d} value={d}>{d}</option>)}</select>
              <span>日</span>
            </div>
          </div>

          <div>
            <label className="block text-sm text-gray-600 mb-1">訪問時間</label>
            <div className="flex items-center gap-2 text-lg">
              <select name="startTimeHour" value={formData.startTimeHour} onChange={handleChange} className="border p-2 rounded bg-gray-50">{hours.map(h => <option key={h} value={h}>{h}</option>)}</select>
              <span>:</span>
              <select name="startTimeMinute" value={formData.startTimeMinute} onChange={handleChange} className="border p-2 rounded bg-gray-50">{minutes.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <span>〜</span>
              <select name="endTimeHour" value={formData.endTimeHour} onChange={handleChange} className="border p-2 rounded bg-gray-50">{hours.map(h => <option key={h} value={h}>{h}</option>)}</select>
              <span>:</span>
              <select name="endTimeMinute" value={formData.endTimeMinute} onChange={handleChange} className="border p-2 rounded bg-gray-50">{minutes.map(m => <option key={m} value={m}>{m}</option>)}</select>
            </div>
          </div>

          <div>
            <label className="block text-sm text-gray-600 mb-1">関与先</label>
            <select name="client" value={formData.client} onChange={handleChange} className="w-full border p-3 rounded bg-gray-50 text-lg">
              <option value="">選択してください</option>
              {settings.clients.map((c, i) => <option key={i} value={c}>{c}</option>)}
            </select>
          </div>

          <div>
            <label className="block text-sm text-gray-600 mb-1">参加者</label>
            <select name="participants" value={formData.participants} onChange={handleChange} className="w-full border p-3 rounded bg-gray-50 text-lg">
              <option value="">選択してください</option>
              {settings.participants.map((p, i) => <option key={i} value={p}>{p}</option>)}
            </select>
          </div>

          <div>
            <label className="block text-sm text-gray-600 mb-1">担当者</label>
            <select name="staff" value={formData.staff} onChange={handleChange} className="w-full border p-3 rounded bg-gray-50 text-lg">
              <option value="">選択してください</option>
              {settings.staffs.map((s, i) => <option key={i} value={s}>{s}</option>)}
            </select>
          </div>
        </section>

        <section className="bg-white p-4 rounded-lg shadow space-y-4">
          <h3 className="font-bold text-gray-700 border-b pb-2">渡し書類等</h3>
          
          <div className="flex items-center gap-3">
            <input type="checkbox" name="doc1Check" checked={formData.doc1Check} onChange={handleChange} className="w-6 h-6 text-blue-600" />
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-medium">試算表</span>
              <span>(</span>
              <select name="doc1Year" value={formData.doc1Year} onChange={handleChange} className="border p-1 rounded bg-gray-50">{years.map(y => <option key={y} value={y}>{y}</option>)}</select>
              <span>年</span>
              <select name="doc1Month" value={formData.doc1Month} onChange={handleChange} className="border p-1 rounded bg-gray-50">{months.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <span>月分 )</span>
            </div>
          </div>

          {[2, 3, 4].map(num => (
            <div key={num} className="flex items-center gap-3">
              <input type="checkbox" name={`doc${num}Check`} checked={formData[`doc${num}Check`]} onChange={handleChange} className="w-6 h-6 text-blue-600" />
              <input type="text" name={`doc${num}Text`} value={formData[`doc${num}Text`]} onChange={handleChange} placeholder={`追加書類 ${num-1}`} className="flex-1 border-b-2 border-gray-300 p-2 bg-transparent focus:outline-none focus:border-blue-500" />
            </div>
          ))}
        </section>

        <section className="bg-white p-4 rounded-lg shadow space-y-2">
          <h3 className="font-bold text-gray-700 border-b pb-2">打合せ内容</h3>
          <p className="text-xs text-gray-500">先方への質問、先方からの質問、話した内容等</p>
          <textarea 
            name="meetingContent" 
            value={formData.meetingContent} 
            onChange={handleChange} 
            rows="15"
            className="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 leading-relaxed text-base"
            placeholder="・令和〇年〇月 月次報告..."
          />
        </section>

        <section className="bg-white p-4 rounded-lg shadow space-y-4">
          <h3 className="font-bold text-gray-700 border-b pb-2">次回訪問予定・ToDo</h3>
          
          <div>
            <label className="block text-sm text-gray-600 mb-1">次回の訪問予定日</label>
            <div className="flex flex-wrap items-center gap-2 text-lg">
              <span>R</span>
              <select name="nextVisitYear" value={formData.nextVisitYear} onChange={handleChange} className="border p-2 rounded bg-gray-50">{years.map(y => <option key={y} value={y}>{y}</option>)}</select>
              <span>年</span>
              <select name="nextVisitMonth" value={formData.nextVisitMonth} onChange={handleChange} className="border p-2 rounded bg-gray-50">{months.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <span>月</span>
              <select name="nextVisitDay" value={formData.nextVisitDay} onChange={handleChange} className="border p-2 rounded bg-gray-50">{days.map(d => <option key={d} value={d}>{d}</option>)}</select>
              <span>日</span>
              <select name="nextVisitTimeHour" value={formData.nextVisitTimeHour} onChange={handleChange} className="border p-2 rounded bg-gray-50 ml-2">{hours.map(h => <option key={h} value={h}>{h}</option>)}</select>
              <span>:</span>
              <select name="nextVisitTimeMinute" value={formData.nextVisitTimeMinute} onChange={handleChange} className="border p-2 rounded bg-gray-50">{minutes.map(m => <option key={m} value={m}>{m}</option>)}</select>
              <span>〜</span>
            </div>
          </div>

          <div>
            <label className="block text-sm text-gray-600 mb-1">次回訪問時までの To Do</label>
            <textarea 
              name="todo" 
              value={formData.todo} 
              onChange={handleChange} 
              rows="4"
              className="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="次回までのタスクを入力..."
            />
          </div>
        </section>
      </div>
    );

    // --- コンポーネント: プレビュー画面（Excel完全再現レイアウト） ---
    const PreviewView = ({ formData, handlePrint }) => {
      const dateObj = new Date(formData.nextVisitYear + 2018, formData.nextVisitMonth - 1, formData.nextVisitDay);
      const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];

      return (
        <div className="bg-gray-200 min-h-screen p-2 sm:p-8 flex justify-center pb-24">
          <div className="no-print fixed top-2 right-2 z-10">
            <button onClick={handlePrint} className="bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 font-bold">
              <IconPrinter size={20} /> PDF出力(印刷)
            </button>
          </div>

          <div className="print-area bg-white w-full max-w-[210mm] shadow-xl p-6 sm:p-10 text-gray-900 font-noto-sans relative flex flex-col box-border min-h-[297mm]">
            
            {/* タイトル */}
            <h1 className="text-[18px] sm:text-[22px] text-center tracking-[1em] mb-4 font-bold ml-[1em]">
              巡回監査レポート
            </h1>

            {/* 上部テーブル */}
            <table className="w-full border-collapse border border-black mb-3 text-[13px] sm:text-[14px]">
              <tbody>
                <tr>
                  <td className="border border-black p-0 w-[30%] align-top">
                    {/* 修正1: 項目名をグレー化 */}
                    <div className="text-center border-b border-black py-0.5 bg-gray-200 tracking-widest">訪問日時</div>
                    {/* 修正2: 行の幅（高さ）を狭めました */}
                    <div className="flex flex-col items-center justify-center py-1.5 sm:py-2 min-h-[3rem]">
                      <div className="mb-0.5">
                        R <span className="inline-block w-6 text-center">{formData.visitYear}</span>年 
                        <span className="inline-block w-6 text-center">{formData.visitMonth}</span>月 
                        <span className="inline-block w-6 text-center">{formData.visitDay}</span>日
                      </div>
                      <div>
                        {formData.startTimeHour} : {formData.startTimeMinute} ～ {formData.endTimeHour} : {formData.endTimeMinute}
                      </div>
                    </div>
                  </td>
                  <td className="border border-black p-0 w-[46%] align-top">
                    {/* 修正1: 項目名をグレー化 */}
                    <div className="text-center border-b border-black py-0.5 bg-gray-200 tracking-widest">関与先・参加者</div>
                    {/* 修正2: 行の幅（高さ）を狭めました */}
                    <div className="flex flex-col justify-center px-4 py-1.5 sm:py-2 min-h-[3rem]">
                      <div className="mb-0.5">関与先： <span className="font-medium">{formData.client}</span></div>
                      <div>参加者： <span className="font-medium">{formData.participants}</span></div>
                    </div>
                  </td>
                  <td className="border border-black p-0 w-[12%] align-top">
                    {/* 修正1: 項目名をグレー化 */}
                    <div className="text-center border-b border-black py-0.5 bg-gray-200 tracking-widest">承認印</div>
                    <div className="min-h-[3rem]"></div>
                  </td>
                  <td className="border border-black p-0 w-[12%] align-top">
                    {/* 修正1: 項目名をグレー化 */}
                    <div className="text-center border-b border-black py-0.5 bg-gray-200 tracking-widest">担当者</div>
                    {/* 修正2: 行の幅（高さ）を狭めました */}
                    <div className="min-h-[3rem] flex items-center justify-center font-medium">{formData.staff}</div>
                  </td>
                </tr>
              </tbody>
            </table>

            {/* 渡し書類等 */}
            <div className="border border-black mb-3 text-[13px] sm:text-[14px] p-2">
              <div className="font-bold mb-1">【渡し書類等】</div>
              {/* 修正3: 2列のグリッドにしてぴったり4項目に修正 */}
              <div className="grid grid-cols-2 gap-x-6 gap-y-2 ml-4">
                {/* 1項目め (試算表) */}
                <div className="flex items-center gap-2">
                  <span className="text-[16px] leading-none">{formData.doc1Check ? '☑' : '☐'}</span>
                  <span className="whitespace-nowrap">試算表（ <span className="inline-block w-4 text-center">{formData.doc1Year}</span> 年 <span className="inline-block w-4 text-center">{formData.doc1Month}</span> 月分 ）</span>
                </div>
                {/* 2項目め */}
                <div className="flex items-center gap-2">
                  <span className="text-[16px] leading-none">{formData.doc2Check ? '☑' : '☐'}</span>
                  <div className={`flex-1 truncate ${formData.doc2Text ? 'border-b border-black' : 'border-b border-gray-400 h-[14px]'}`}>{formData.doc2Text}</div>
                </div>
                {/* 3項目め */}
                <div className="flex items-center gap-2">
                  <span className="text-[16px] leading-none">{formData.doc3Check ? '☑' : '☐'}</span>
                  <div className={`flex-1 truncate ${formData.doc3Text ? 'border-b border-black' : 'border-b border-gray-400 h-[14px]'}`}>{formData.doc3Text}</div>
                </div>
                {/* 4項目め */}
                <div className="flex items-center gap-2">
                  <span className="text-[16px] leading-none">{formData.doc4Check ? '☑' : '☐'}</span>
                  <div className={`flex-1 truncate ${formData.doc4Text ? 'border-b border-black' : 'border-b border-gray-400 h-[14px]'}`}>{formData.doc4Text}</div>
                </div>
              </div>
            </div>

            {/* 打合せ内容・ToDo（ひとつの大きな枠） */}
            <div className="border border-black text-[13px] sm:text-[14px] flex-1 flex flex-col">
              
              {/* ヘッダー部分 */}
              <div className="text-center py-1 bg-gray-200 border-b border-black font-medium tracking-wide">
                打合せ内容（先方への質問、先方からの質問、話した内容等）
              </div>
              
              {/* 入力欄（ノート罫線） */}
              <div className="px-2 py-0 h-[510px] sm:h-[600px] lined-bg whitespace-pre-wrap break-words">
                {formData.meetingContent}
              </div>

              {/* 次回訪問予定日 */}
              {/* 修正4: 文字部分のみグレー化、横は白 */}
              <div className="border-t border-black flex items-center">
                <div className="font-bold bg-gray-200 px-2 py-1.5 border-r border-black h-full flex items-center w-[35%] sm:w-[28%] shrink-0">
                  【次回の訪問予定日】
                </div>
                <div className="px-2 py-1.5 flex-1 bg-white">
                  R <span className="inline-block w-6 text-center">{formData.nextVisitYear}</span> 年 
                  <span className="inline-block w-6 text-center">{formData.nextVisitMonth}</span> 月 
                  <span className="inline-block w-6 text-center">{formData.nextVisitDay}</span> 日（{dayOfWeek}）
                  <span className="ml-4">{formData.nextVisitTimeHour} : {formData.nextVisitTimeMinute} ～</span>
                </div>
              </div>

              {/* ToDo */}
              {/* 修正5: 文字部分のみグレー化、横は白 */}
              <div className="border-t border-black flex flex-1 min-h-[120px]">
                <div className="font-bold bg-gray-200 px-2 py-1.5 border-r border-black w-[35%] sm:w-[28%] shrink-0">
                  【次回訪問時までのTo Do】
                </div>
                <div className="flex-1 bg-white">
                  <div className="lined-bg whitespace-pre-wrap px-2 h-full min-h-[90px]">
                    {formData.todo}
                  </div>
                </div>
              </div>
            </div>

            {/* フッター */}
            <div className="text-center mt-3 text-[14px] sm:text-[15px] text-gray-800 tracking-widest font-medium">
              税理士法人アドヴァンス
            </div>
            
          </div>
        </div>
      );
    };

    // --- メインアプリ ---
    function App() {
      const now = new Date();
      const currentReiwa = now.getFullYear() - 2018;

      const [activeTab, setActiveTab] = useState('input');

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('auditAppSettings');
        return saved ? JSON.parse(saved) : {
          clients: ['医療法人 杉浦整形外科'],
          participants: ['院長', '西田'],
          staffs: ['西田']
        };
      });

      const [formData, setFormData] = useState({
        visitYear: currentReiwa,
        visitMonth: now.getMonth() + 1,
        visitDay: now.getDate(),
        startTimeHour: '13',
        startTimeMinute: '30',
        endTimeHour: '15',
        endTimeMinute: '00',
        client: settings.clients[0] || '',
        participants: settings.participants[0] || '',
        staff: settings.staffs[0] || '',
        doc1Check: true,
        doc1Year: currentReiwa,
        doc1Month: now.getMonth() === 0 ? 12 : now.getMonth(),
        doc2Check: false,
        doc2Text: '',
        doc3Check: false,
        doc3Text: '',
        doc4Check: false,
        doc4Text: '',
        meetingContent: '',
        nextVisitYear: currentReiwa,
        nextVisitMonth: now.getMonth() === 11 ? 1 : now.getMonth() + 2,
        nextVisitDay: now.getDate(),
        nextVisitTimeHour: '13',
        nextVisitTimeMinute: '30',
        todo: ''
      });

      useEffect(() => {
        localStorage.setItem('auditAppSettings', JSON.stringify(settings));
      }, [settings]);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
          <main className="flex-1 overflow-y-auto">
            {activeTab === 'input' && <InputFormView formData={formData} handleChange={handleChange} settings={settings} />}
            {activeTab === 'preview' && <PreviewView formData={formData} handlePrint={handlePrint} />}
            {activeTab === 'settings' && <SettingsView settings={settings} setSettings={setSettings} />}
          </main>

          <nav className="no-print fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-50">
            <button 
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center p-2 flex-1 ${activeTab === 'settings' ? 'text-blue-600 font-bold' : 'text-gray-500'}`}
            >
              <IconSettings size={24} />
              <span className="text-[10px] mt-1">マスタ登録</span>
            </button>
            <button 
              onClick={() => setActiveTab('input')}
              className={`flex flex-col items-center p-2 flex-1 ${activeTab === 'input' ? 'text-blue-600 font-bold' : 'text-gray-500'}`}
            >
              <IconEdit3 size={24} />
              <span className="text-[10px] mt-1">入力</span>
            </button>
            <button 
              onClick={() => setActiveTab('preview')}
              className={`flex flex-col items-center p-2 flex-1 ${activeTab === 'preview' ? 'text-blue-600 font-bold' : 'text-gray-500'}`}
            >
              <IconFileText size={24} />
              <span className="text-[10px] mt-1">プレビュー・PDF</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
